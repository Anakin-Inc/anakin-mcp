anakin:
    display_name: Anakin
    categories:
        - search
        - dev-tools
    auth_mode: API_KEY
    proxy:
        base_url: https://api.anakin.io/v1
        headers:
            x-api-key: ${apiKey}
    docs: https://nango.dev/docs/integrations/all/anakin
    credentials:
        apiKey:
            type: string
            title: API Key
            description: Get a free key at https://anakin.io/dashboard (300 credits, no card required)
